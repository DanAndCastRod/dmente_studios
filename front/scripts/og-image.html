<!doctype html>
<!--
  Fuente de public/og-dmente.jpg (imagen Open Graph de 1200x630).
  Se arma solo con la tipografia y los colores del sitio, sin fotografias.
  Para regenerarla: abrir este archivo en Chromium con viewport 1200x630 y
  guardar una captura de la pagina en front/public/og-dmente.jpg.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<title>OG D'mente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Syncopate:wght@400;700&display=block" rel="stylesheet">
<style>
  :root {
    --violeta: #5B2C6F;
    --violeta-claro: #B983CC;
    --cian: #00FFFF;
    --fondo: #0A0A0A;
    --texto: #F5F5F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--fondo); }
  body {
    position: relative;
    color: var(--texto);
    font-family: 'Montserrat', sans-serif;
    background-image:
      radial-gradient(ellipse 60% 70% at 88% 18%, rgba(91, 44, 111, 0.55), transparent 70%),
      radial-gradient(ellipse 40% 50% at 100% 100%, rgba(0, 255, 255, 0.10), transparent 70%),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  }
  .marco { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .pastilla {
    align-self: flex-start;
    border: 1px solid rgba(91, 44, 111, 0.6);
    background: rgba(91, 44, 111, 0.18);
    border-radius: 999px;
    padding: 10px 22px;
    color: var(--cian);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Syncopate', sans-serif;
    font-weight: 700;
    font-size: 76px;
    line-height: 1.08;
    text-transform: uppercase;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--violeta-claro), var(--cian));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .pie { display: flex; align-items: center; justify-content: space-between; }
  .marca { display: flex; align-items: center; gap: 16px; }
  .circulo {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(91, 44, 111, 0.25);
    border: 2px solid rgba(185, 131, 204, 0.6);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 28px; color: var(--violeta-claro);
  }
  .nombre { font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 0.08em; }
  .contacto { text-align: right; font-size: 22px; color: #D1D5DB; line-height: 1.4; }
  .contacto strong { color: var(--texto); font-weight: 600; }
  .linea { position: absolute; left: 72px; right: 72px; bottom: 150px; height: 2px;
    background: linear-gradient(90deg, var(--violeta), var(--cian) 60%, transparent); opacity: 0.7; }
</style>
</head>
<body>
  <div class="linea"></div>
  <div class="marco">
    <div class="pastilla">Sala de ensayo y producción</div>
    <h1>La hipnosis<br><span class="grad">del sonido</span><br>en Pereira</h1>
    <div class="pie">
      <div class="marca">
        <div class="circulo">D'</div>
        <div class="nombre">MENTE</div>
      </div>
      <div class="contacto">Reservas por Instagram<br><strong>@dmenteestudio</strong></div>
    </div>
  </div>
</body>
</html>
